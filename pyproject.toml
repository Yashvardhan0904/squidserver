authors = [
    { name = "Yashvardhan0904", email = "yvardhan873@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "psycopg2-binary>=2.9.12",
